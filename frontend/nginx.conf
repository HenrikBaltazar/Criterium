server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=30s;

    # Serve PWA manifest and static assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy REST API calls to backend container with dynamic resolver
    location /api/ {
        set $upstream_api http://api:4000;
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Prevent caching of JS, CSS and HTML bundles to ensure instant updates upon build
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # Cache static media assets
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
